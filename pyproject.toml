[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-assistant-mcp"
version = "0.1.0"
description = "Read-only personal Telegram MCP resource server"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["mcp==1.26.0", "telethon==1.45.0", "PyJWT[crypto]==2.15.1"]

[project.optional-dependencies]
qr-login = ["qrcode==8.2"]

[project.scripts]
telegram-assistant-mcp = "telegram_assistant.server:main"

[tool.setuptools.packages.find]
where = ["src"]
